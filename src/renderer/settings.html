<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>小钩晴 · 窗边的休息角</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" type="module"></script>
</head>
<body>
  <main id="main" class="room" aria-label="小钩晴的窗边休息角">
    <img class="room-background" src="../../assets/hare-workbench.png" alt="傍晚的窗边工作台，台灯照着书和小小的工程工具" draggable="false">
    <header class="room-header">
      <div class="room-name"><span class="name-halo" aria-hidden="true"></span><span>小钩晴<small>窗边的休息角</small></span></div>
      <button id="settings-button" class="settings-entry" type="button" aria-haspopup="dialog" aria-controls="settings-drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>设置</button>
    </header>
    <section class="room-greeting" aria-label="陪伴状态">
      <h1 id="phase-label">正在连接桌面上的她…</h1>
      <p id="idle-status">读取陪伴状态中。</p>
    </section>
    <button id="habits-button" class="habit-note" type="button" aria-haspopup="dialog" aria-controls="settings-drawer">
      <span class="note-pin" aria-hidden="true"></span><span class="note-title">散步的小约定</span>
      <span class="note-copy">闲下来 <strong id="habit-minutes">10 分钟</strong>，<br>就去走一圈。</span>
      <span class="note-link">改改小习惯 <span aria-hidden="true">↗</span></span>
    </button>
    <div id="scene-actor" class="scene-actor"><span class="actor-shadow" aria-hidden="true"></span><canvas id="scene-pet" width="204" height="221" role="img" aria-label="小钩晴的动作预览"></canvas></div>
    <p id="interaction-feedback" class="interaction-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="action-bar" role="group" aria-label="和小钩晴互动">
      <div class="action-group"><button id="walk-button" type="button" disabled class="room-action primary-action"><span aria-hidden="true">↗</span> 散步</button><button id="wave-button" type="button" disabled class="room-action">挥挥手</button><button id="jump-button" type="button" disabled class="room-action">小跳一下</button></div>
      <span class="action-divider" aria-hidden="true"></span>
      <div class="action-group secondary-actions"><button id="home-button" type="button" disabled class="room-action">回家</button><button id="pause-button" type="button" disabled class="room-action">暂停</button></div>
    </div>
    <p class="room-tip">关掉这个窗口，她还在任务栏旁。</p>
    <div id="demo-banner" class="demo-banner" hidden>界面演示 · 这里的操作不会保存或控制桌宠</div>
  </main>
  <dialog id="settings-drawer" class="settings-drawer" aria-labelledby="drawer-title">
    <header class="drawer-header"><div><p>小钩晴的工程笔记</p><h2 id="drawer-title">把日常调成喜欢的样子。</h2></div><button id="close-settings" type="button" class="close-settings" aria-label="关闭设置">×</button></header>
    <div class="drawer-content">
      <section class="drawer-section" aria-labelledby="walk-title">
        <h3 id="walk-title">出门</h3>
        <div class="idle-control"><div><label for="idle-minutes">闲下来多久，出去走走？</label><p>没有键盘或鼠标操作时开始计时</p></div><div class="number-unit"><input disabled id="idle-minutes" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="idle-help" required><span>分钟</span></div></div>
        <p id="idle-help" class="field-help">每次闲置只走一圈：从停靠点到最左侧，再到最右侧，最后回家。你回来操作时，她会提前往回走。</p>
        <div class="range-field"><div class="field-label"><label for="speed">散步的步调</label><output id="speed-output" for="speed">70 DIP/秒</output></div><input disabled id="speed" type="range" min="20" max="180" step="5"><div class="range-endpoints"><span>悠闲一点</span><span>轻快一点</span></div></div>
      </section>
      <section class="drawer-section" aria-labelledby="appearance-title">
        <h3 id="appearance-title">样子</h3>
        <div class="range-field"><div class="field-label"><label for="pet-height">桌面上的角色大小</label><output id="height-output" for="pet-height">156 DIP</output></div><input disabled id="pet-height" type="range" min="96" max="240" step="4"><div class="range-endpoints"><span>小巧</span><span>醒目</span></div></div>
        <div class="display-field"><label for="display">待在哪一块屏幕？</label><select disabled id="display"><option value="primary">跟随主显示器</option></select></div><p class="field-help">在桌面上拖动她，可以重新安排停靠点。</p>
      </section>
      <section class="drawer-section" aria-labelledby="details-title">
        <h3 id="details-title">在桌面上</h3>
        <div class="switch-list">
          <label class="switch-row" for="always-on-top"><span><strong>待在窗口上面</strong><small>开启后，她会显示在其他应用窗口上方。</small></span><input disabled id="always-on-top" type="checkbox" role="switch"><span class="switch-track" aria-hidden="true"></span></label>
          <label class="switch-row" for="click-through"><span><strong>让鼠标穿过去</strong><small>鼠标会穿过她，点不到她；可以从托盘恢复。</small></span><input disabled id="click-through" type="checkbox" role="switch"><span class="switch-track" aria-hidden="true"></span></label>
          <label class="switch-row" for="launch-at-login"><span><strong>登录电脑时，就来陪你</strong><small id="login-help">随 Windows 登录自动启动。</small></span><input disabled id="launch-at-login" type="checkbox" role="switch" aria-describedby="login-help"><span class="switch-track" aria-hidden="true"></span></label>
        </div>
      </section>
      <p class="interaction-help">轻点挥手 · 双击小跳 · 拖动换停靠点 · 右键打开这里</p>
    </div>
    <footer class="drawer-footer"><span id="save-status" role="status" aria-live="polite">设置会自动保存</span><span id="version">v0.1.1</span></footer>
  </dialog>
</body>
</html>
